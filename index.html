<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirotécnicos El Visor La Gran B | Portafolio y Servicios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            background-color: #07080b;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        section, .hero {
            scroll-margin-top: 75px;
        }

        /* Encabezado */
        header {
            background-color: rgba(15, 20, 28, 0.95);
            backdrop-filter: blur(8px);
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f39c12;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }
        .logo-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-nav img {
            height: 40px;
            width: auto;
            border-radius: 4px;
        }
        .logo-nav span {
            font-size: 1.1rem;
            font-weight: 900;
            color: #f39c12;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        nav a {
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #f39c12;
        }

        /* Portada (Hero) */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background: radial-gradient(circle at center, #1a1528 0%, #07080b 100%);
            overflow: hidden;
        }
        #fireworks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 850px;
            animation: fadeInUp 1.2s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hero-logo {
            max-width: 240px;
            width: 100%;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(243, 156, 18, 0.4));
            animation: pulseLogo 3s infinite ease-in-out;
        }
        .hero h1 {
            font-size: 2.6rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
        }
        .hero h1 span {
            background: linear-gradient(90deg, #f39c12, #ffdd59, #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            font-size: 1.1rem;
            max-width: 650px;
            margin: 0 auto 30px auto;
            color: #d1d5db;
        }
        .hero-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: linear-gradient(45deg, #e67e22, #f39c12);
            color: #000;
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.6);
            animation: pulse 2s infinite;
            transition: transform 0.3s;
            display: inline-block;
        }
        .btn-primary:hover {
            transform: scale(1.05);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ffffff;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.05rem;
            transition: all 0.3s;
            display: inline-block;
        }
        .btn-secondary:hover {
            background: #ffffff;
            color: #07080b;
        }

        /* Secciones generales */
        section {
            padding: 80px 5%;
        }
        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 40px;
            color: #f39c12;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Quiénes Somos */
        .about-container {
            max-width: 900px;
            margin: 0 auto;
            background: linear-gradient(135deg, #131720, #1c2230);
            padding: 40px;
            border-radius: 12px;
            border-left: 5px solid #f39c12;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .about-container p {
            color: #d1d5db;
            margin-bottom: 15px;
            font-size: 1.05rem;
            text-align: justify;
        }

        /* --- SECCIÓN DE NUESTROS SERVICIOS (TARJETAS GIRATORIAS 3D) --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .flip-card {
            background-color: transparent;
            width: 100%;
            height: 320px;
            perspective: 1000px;
            cursor: pointer;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
